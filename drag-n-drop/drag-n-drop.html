<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Drag-and-drop</title>
    <style>

        .column {
            width: 260px;
            padding: 15px;
            background: grey;
            margin: 15px;
        }

        .drop-zone {
            min-height: 150px;
            padding: 10px;
        }

        .card {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            cursor: grab;
            user-select: none;
        }
    </style>
</head>
<body>

    <h1><a href="./index.html">Drag and drop</a></h1>

    <div class="board">
        <div class="column">
            <h3>Надо перенести</h3>
            <div class="drop-zone" id="zone1">
                <div class="card" draggable="true" data-id="1">Объект №1</div>
                <div class="card" draggable="true" data-id="2">Объект №2</div>
                <div class="card" draggable="true" data-id="3">Объект №3</div>
            </div>
        </div>

        <div class="column">
            <h3>Перенесли</h3>
            <div class="drop-zone" id="zone2"></div>
        </div>
    </div>

    <script>


        document.querySelectorAll('.card').forEach(function (card) {

            card.addEventListener('dragstart', function (event) {
                card.classList.add('dragging');


                event.dataTransfer.setData('text/plain', card.dataset.id);
                event.dataTransfer.effectAllowed = 'move';
            });

  
            card.addEventListener('dragend', function () {
                card.classList.remove('dragging');
            });
        });


        document.querySelectorAll('.drop-zone').forEach(function (zone) {

  
            zone.addEventListener('dragover', function (event) {
                event.preventDefault();
                event.dataTransfer.dropEffect = 'move';
            });


            zone.addEventListener('dragenter', function (event) {
                event.preventDefault();
                zone.classList.add('drag-over');
            });


            zone.addEventListener('dragleave', function () {
                zone.classList.remove('drag-over');
            });


            zone.addEventListener('drop', function (event) {
                event.preventDefault();
                zone.classList.remove('drag-over');

                const id = event.dataTransfer.getData('text/plain');
                const card = document.querySelector('[data-id="' + id + '"]');

                if (card) {
                    zone.appendChild(card);

                }
            });
        });
    </script>

</body>
</html>
