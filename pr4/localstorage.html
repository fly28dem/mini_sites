<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LocalStorage</title>
</head>
<body>
    <h2>Сохранение данных</h2>
    
    <input type="text" id="input" placeholder="Введите что-нибудь">
    <br>
    <button onclick="saveData()">Сохранить</button>
    <button onclick="loadData()">Загрузить</button>
    <button onclick="clearData()">Очистить</button>
    
    <div id="result">Здесь появится сохраненное значение</div>

    <script>
        function saveData() {
            const value = document.getElementById('input').value;
            localStorage.setItem('myData', value);
            alert('Сохранено!');
        }

        function loadData() {
            const value = localStorage.getItem('myData');
            document.getElementById('result').textContent = value || 'Данных нет';
        }

        function clearData() {
            localStorage.removeItem('myData');
            document.getElementById('result').textContent = 'Данные удалены';
        }
    </script>
</body>
</html>
